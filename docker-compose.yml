version: "3.8"
services:
  # ── Signal CLI REST API ──────────────────────────────────────────────
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    restart: unless-stopped
    environment:
      - MODE=json-rpc
    ports:
      - "9922:8080"
    volumes:
      - ./signal-cli-config:/home/.local/share/signal-cli

  # ── Telegram → Signal Bridge ─────────────────────────────────────────
  bridge:
    build: .
    container_name: telegram-signal-bridge
    restart: unless-stopped
    depends_on:
      - signal-api
    env_file:
      - .env
    environment:
      - SIGNAL_API_URL=http://signal-api:8080
    volumes:
      - ./bridge-data:/app/data

  # ── Admin Dashboard ─────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: bridge-dashboard
    restart: unless-stopped
    command: python -u dashboard.py
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bridge_logs.db
      - USERS_FILE=/app/data/users_data.json
      - DASHBOARD_PORT=8765
    ports:
      - "8765:8765"
    volumes:
      - ./bridge-data:/app/data
